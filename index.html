<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070A12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!--
      Installable: Add to Home Screen keeps the browser chrome unless a manifest
      and an iOS icon are advertised. The icon is PNG because iOS ignores SVG for
      apple-touch-icon, and both paths are %BASE_URL%-relative so a project page
      served from /<repository>/ finds them too.
    -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIXFOLD" />
    <meta
      name="description"
      content="SIXFOLD: Elemental Ascension — a top-down 2D pixel-action roguelite with 25 elements, 200 story waves and infinite Ascension Mode."
    />
    <title>SIXFOLD: Elemental Ascension</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
